<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        body > section{
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
        }

        body > section > div{
            width: 400px;
            height: 400px;
        }

        #div1{
            background-color: red;
        }
        #div2{
            background-color: blue;
        }
        #div3{
            background-color: orange;
        }
        #div4{
            background-color: green;
        }
        #div5{
            background-color: greenyellow;
        }
        @media all and (max-width: 600px) {
            body > section{
                flex-direction: column;
            }
        }

        @media all and (max-width: 1000px) {
            body > section{
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <section>
        <div id="div1"></div>
        <div id="div2"></div>
        <div id="div3"></div>
        <div id="div4"></div>
        <div id="div5"></div>
    </section>
</body>
</html>
