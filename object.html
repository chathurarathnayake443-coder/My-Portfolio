<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        .scene {
            perspective: 600px; /* creates 3D depth */
            width: 200px;
            height: 200px;
            margin: 100px auto;
        }

        .cube {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d; /* critical — keeps children in 3D space */
            animation: rotateCube 6s ease infinite;
        }
        .cube:hover {
            animation:none;
        }

        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(100, 150, 255, 0.3);
            border: 2px solid royalblue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Outfit", sans-serif;
            font-size: 20px;
        }

        #face front{
            background-color: gold;
        }
        #face back{
            background-color: forestgreen;
        }
        #face top{
            background-color: purple;
        }
        #face left{
            background-color: dodgerblue;
        }
        #face bottom{
            background-color: lightgreen;
        }
        #face right{
            background-color: lightpink;
        }

        /* position each face */
        .front  { transform: translateZ(100px); }
        .back   { transform: translateZ(-100px) rotateY(180deg); }
        .left   { transform: translateX(-100px) rotateY(-90deg); }
        .right  { transform: translateX(100px)  rotateY(90deg); }
        .top    { transform: translateY(-100px) rotateX(90deg); }
        .bottom { transform: translateY(100px)  rotateX(-90deg); }

        @keyframes rotateCube {
            from { transform: rotateX(0deg)   rotateY(0deg) rotateZ(0deg); }
            to   { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg) ; }
        }
    </style>
</head>
<body>
<div class="scene">
    <div class="cube">
        <div id="face front" class="face front">Hello</div>
        <div id="face back" class="face back">Back</div>
        <div id="face left" class="face left">Left</div>
        <div id="face right" class="face right">Right</div>
        <div id="face top" class="face top">Top</div>
        <div id="face bottom" class="face bottom">Bottom</div>
    </div>
</div>
<img src="assets/images/rock.png" alt="" width="300px">

</body>
</html>
