<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 400vh;
        }

        #sticky-container {
            position: sticky;
            top: 0;
            width: 100vw;
            height: 100vh;
            overflow: clip; /* changed from hidden to clip */
        }

        #section-2 {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background-color: cornflowerblue;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            z-index: 0;
        }

        #section-2 p {
            font-size: 18px;
            line-height: 1.8;
        }

        #section-1 {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background-color: purple;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;

            /* single animation combining both effects */
            animation: sectionFade linear both;
            animation-timeline: scroll(root); /* root fixes the overflow issue */
            animation-range: cover 50% cover 100%;
        }

        #text {
            font-size: 100px;
            font-weight: bold;
            color: white;
            text-align: center;
            position: relative;
            z-index: 2;

            animation: scaleText linear both;
            animation-timeline: scroll(root);
            animation-range: cover 0% cover 60%;
        }

        @keyframes scaleText {
            from { transform: scale(0.5); opacity: 1; }
            to   { transform: scale(8);   opacity: 0; }
        }

        @keyframes sectionFade {
            from { opacity: 1; }
            to   { opacity: 0; }
        }
    </style>
</head>
<body>

<div id="sticky-container">
    <div id="section-2">
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ad architecto consectetur culpa dolor eius est ex in laudantium magnam necessitatibus sequi ut voluptatum.</p>
    </div>
    <div id="section-1">
        <div id="text">Hello to My Page</div>
    </div>
</div>
<div style="width: 100px; height: 700px; background-color: tomato"></div>

</body>
</html>
