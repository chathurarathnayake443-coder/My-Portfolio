<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        body {
            margin: 0;
        }

        .sticky-div {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
        }

        #div1 { background-color: purple;      z-index: 1; }
        #div2 { background-color: hotpink;     z-index: 2; }
        #div3 { background-color: forestgreen; z-index: 3; }
        #div4 { background-color: goldenrod;   z-index: 4; }

        section p{
            position: relative;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: auto;
            color: white;
        }

        section img{
            width: 300px;
        }
    </style>
</head>
<body>
<section>
    <div id="div1" class="sticky-div"><p>Hello</p><img src="assets/images/zany-1.png" alt=""></div>
    <div id="div2" class="sticky-div"><p>Hello</p><img src="assets/images/zany-2.png" alt=""></div>
    <div id="div3" class="sticky-div"><p>Hello</p><img src="assets/images/zany-3.png" alt=""></div>
    <div id="div4" class="sticky-div"><p>Hello</p><img src="assets/images/zany-4.png" alt=""></div>
</section>
<section style="width: 100%; height: 100vh; background-color: white" ></section>
</body>
</html>
