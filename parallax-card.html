<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .card-scene {
            perspective: 800px; /* 3D depth */
            width: 350px;
            height: 220px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            border-radius: 20px;
            background: linear-gradient(135deg, royalblue, deeppink);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: transform 0.6s ease;
            cursor: pointer;
        }

        /* tilt on hover — pure CSS parallax */
        .card:hover {
            transform: rotateY(15deg) rotateX(10deg);
        }

        /* each layer floats at different Z depth */
        .card-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }

        .layer-back {
            transform: translateZ(0px);
            background: rgba(255,255,255,0.05);
        }

        .layer-mid {
            transform: translateZ(30px); /* floats above card */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .layer-front {
            transform: translateZ(60px); /* floats highest */
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
        }

        .card-title {
            font-family: "Outfit", sans-serif;
            font-size: 32px;
            color: white;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .card-desc {
            font-family: "Outfit", sans-serif;
            font-size: 16px;
            color: rgba(255,255,255,0.8);
        }
        /* tilt left side */
        .card-scene:hover .card {
            transform: rotateY(-20deg) rotateX(5deg);
        }

        /* tilt top */
        .card-scene:hover .card {
            transform: rotateX(20deg) rotateY(0deg);
        }

        /* spin full rotate */
        .card-scene:hover .card {
            transform: rotateY(180deg); /* full flip */
        }
        .card::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 20px;
            background: linear-gradient(
                    135deg,
                    rgba(255,255,255,0.3) 0%,
                    transparent 50%
            );
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover::after {
            opacity: 1; /* shine appears on hover */
        }
    </style>
</head>
<body>
<div class="card-scene">
    <div class="card">
        <div class="card-layer layer-back"></div>
        <div class="card-layer layer-mid">
            <h2 class="card-title">ZANY Store</h2>
        </div>
        <div class="card-layer layer-front">
            <p class="card-desc">ERP System</p>
        </div>
    </div>
</div>
</body>
</html>
